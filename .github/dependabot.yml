version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /services/api
      - /services/job
      - /services/webapp
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
    groups:
      python-tests:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /services/api
      - /services/job
      - /services/webapp
    schedule:
      interval: weekly
    groups:
      containers:
        patterns: ["*"]
